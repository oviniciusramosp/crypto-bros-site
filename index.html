<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Crypto Bros</title>
    <meta name="description" content="Feed do Crypto Bros — mercado, estudos e trade cripto." />
    <!-- Link previews (Open Graph + Twitter) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Crypto Bros" />
    <meta property="og:title" content="Crypto Bros" />
    <meta property="og:description" content="Feed do Crypto Bros — mercado, estudos e trade cripto." />
    <meta property="og:url" content="https://crypto-bros.com/" />
    <meta property="og:image" content="https://crypto-bros.com/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Crypto Bros" />
    <meta name="twitter:description" content="Feed do Crypto Bros — mercado, estudos e trade cripto." />
    <meta name="twitter:image" content="https://crypto-bros.com/og.png" />
    <link rel="icon" type="image/png" href="./favicon.png?v=20" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Native App Store smart banner (iOS Safari) -->
    <meta name="apple-itunes-app" content="app-id=6758371729, app-argument=https://crypto-bros.com/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="./styles.css?v=113" />
    <script>
      (function () {
        try {
          var m = localStorage.getItem('cb-theme');
          if (m !== 'light' && m !== 'dark') {
            m = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', m);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!-- Apple-style locale suggestion banner (shown when the visitor's country
         speaks a different language than the one currently selected) -->
    <div id="lang-banner" class="lang-banner hidden">
      <span id="lang-banner-text" class="lang-banner__text"></span>
      <button id="lang-banner-switch" class="lang-banner__btn"></button>
      <button id="lang-banner-close" class="lang-banner__close" aria-label="Fechar">✕</button>
    </div>

    <!-- Login -->
    <section id="login" class="login hidden">
      <img class="login__logo" src="./icon.png" alt="Crypto Bros" />
      <h1 class="login__title">Crypto Bros</h1>
      <p class="login__subtitle" id="login-subtitle"></p>
      <div class="g-wrap">
        <div class="g-fake" aria-hidden="true">
          <svg viewBox="0 0 48 48" width="18" height="18"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          <span id="g-fake-label">Continuar com o Google</span>
        </div>
        <div id="google-btn" class="g-real"></div>
      </div>
      <p class="login__hint" id="login-hint"></p>
      <p id="login-error" class="login__error hidden"></p>
      <div class="menu__seg login__lang" id="login-lang">
        <button data-lang="pt">Português BR</button>
        <button data-lang="en">English</button>
      </div>
    </section>

    <!-- Feed -->
    <main id="app" class="hidden">
      <div id="ios-banner" class="ios-banner hidden">
        <img src="./icon.png" alt="" class="ios-banner__icon" />
        <div class="ios-banner__text"><strong>Crypto Bros</strong><span id="ios-banner-sub"></span></div>
        <a id="ios-banner-cta" class="ios-banner__cta" href="#" target="_blank" rel="noopener"></a>
        <button id="ios-banner-close" class="ios-banner__close" aria-label="Fechar">✕</button>
      </div>

      <div class="app-body">
        <div id="sidebar-backdrop" class="sidebar-backdrop" hidden></div>

        <!-- iPad-style sidebar: in-flow + collapsible on desktop; overlay drawer on phone/tablet. -->
        <aside id="sidebar" class="sidebar" aria-label="Navegação">
          <div class="sidebar__top">
            <button type="button" id="sidebar-toggle" class="sidebar__toggle" aria-expanded="true" aria-controls="sidebar-nav">
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="3" y="4" width="18" height="16" rx="2.5" stroke="currentColor" stroke-width="1.6"/>
                <path d="M9 4.5v15" stroke="currentColor" stroke-width="1.6"/>
                <rect x="3.75" y="4.75" width="4.75" height="14.5" rx="1.5" fill="currentColor" opacity="0.22"/>
              </svg>
            </button>
            <span class="sidebar__brand">
              <!-- Wordmark: dark letters on light theme, white letters on dark theme. -->
              <img class="sidebar__wordmark sidebar__wordmark--for-light" src="./assets/brand/cryptobros-wordmark-light.png" alt="Crypto Bros" width="170" height="46" decoding="async" />
              <img class="sidebar__wordmark sidebar__wordmark--for-dark" src="./assets/brand/cryptobros-wordmark-dark.png" alt="" width="170" height="46" decoding="async" />
            </span>
          </div>
          <nav class="sidebar__nav" id="sidebar-nav">
            <button type="button" class="sidebar__item" data-view="feed" id="sidebar-feed">
              <span class="sidebar__icon" aria-hidden="true"></span>
              <span class="sidebar__label"></span>
            </button>
            <button type="button" class="sidebar__item" data-view="lessons" id="sidebar-lessons">
              <span class="sidebar__icon" aria-hidden="true"></span>
              <span class="sidebar__label"></span>
            </button>
            <div class="sidebar__divider" role="separator"></div>
            <button type="button" class="sidebar__item" data-view="glossary" id="sidebar-glossary">
              <span class="sidebar__icon" aria-hidden="true"></span>
              <span class="sidebar__label"></span>
            </button>
            <button type="button" class="sidebar__item" data-view="dca" id="sidebar-dca">
              <span class="sidebar__icon" aria-hidden="true"></span>
              <span class="sidebar__label"></span>
            </button>
            <button type="button" class="sidebar__item" data-view="pos" id="sidebar-pos">
              <span class="sidebar__icon" aria-hidden="true"></span>
              <span class="sidebar__label"></span>
            </button>
          </nav>

          <!-- Account / prefs: theme always visible; user row opens popover (notif / lang / logout). -->
          <div class="sidebar__footer" id="sidebar-footer">
            <div class="menu__section sidebar__footer-section sidebar__footer-theme">
              <div class="menu__seg menu__seg--icons" id="menu-theme" role="group" aria-label="Aparência">
                <button type="button" data-theme-pref="system"></button>
                <button type="button" data-theme-pref="light"></button>
                <button type="button" data-theme-pref="dark"></button>
              </div>
              <!-- Collapsed rail: single cycle button (system → light → dark). -->
              <button type="button" class="menu__theme-cycle" id="menu-theme-cycle" aria-label="Alterar Tema"></button>
            </div>
            <div class="sidebar__user-wrap" id="sidebar-user-wrap">
              <button type="button" class="menu__user menu__user--trigger" id="user-menu-trigger" aria-haspopup="menu" aria-expanded="false" aria-controls="user-popover">
                <div class="menu__user-avatar" id="menu-avatar"></div>
                <div class="menu__user-info">
                  <div class="menu__user-name" id="menu-name"></div>
                  <div class="menu__user-email" id="menu-email"></div>
                </div>
                <span class="menu__user-chev" aria-hidden="true">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
                </span>
              </button>
              <div id="user-popover" class="user-popover hidden" role="menu">
                <div class="menu__section menu__coins-section hidden" id="menu-coins-section">
                  <div class="menu__label" id="menu-coins-label">Moedas favoritas</div>
                  <div class="menu__coins" id="menu-coins"></div>
                </div>
                <!-- Order: idioma → notificações → sair -->
                <div class="menu__section">
                  <div class="menu__label" id="menu-lang-label">Idioma</div>
                  <div class="menu__seg" id="menu-lang">
                    <button type="button" data-lang="pt">Português BR</button>
                    <button type="button" data-lang="en">English</button>
                  </div>
                </div>
                <button type="button" class="menu__switch-row" id="menu-notif-row" role="menuitem">
                  <span class="menu__switch-left">
                    <svg class="menu__switch-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
                    <span class="menu__switch-label" id="menu-notif-label">Notificações</span>
                  </span>
                  <span class="menu__switch" id="menu-notif" role="switch" aria-checked="false" aria-hidden="true">
                    <span class="menu__switch-knob"></span>
                  </span>
                </button>
                <button type="button" class="menu__logout" id="menu-logout" role="menuitem">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                  <span id="menu-logout-label">Sair</span>
                </button>
              </div>
            </div>
          </div>
        </aside>

        <div class="app-shell">
        <!-- Mobile/tablet top bar: menu (left) + wordmark. Hidden on desktop. -->
        <header class="mobile-topbar" id="mobile-topbar">
          <button type="button" id="sidebar-fab" class="mobile-topbar__menu" aria-controls="sidebar" aria-expanded="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
          </button>
          <span class="mobile-topbar__brand">
            <img class="sidebar__wordmark sidebar__wordmark--for-light" src="./assets/brand/cryptobros-wordmark-light.png" alt="Crypto Bros" width="170" height="46" decoding="async" />
            <img class="sidebar__wordmark sidebar__wordmark--for-dark" src="./assets/brand/cryptobros-wordmark-dark.png" alt="" width="170" height="46" decoding="async" />
          </span>
        </header>
      <div class="feed">
        <div id="view-feed">
          <section id="marquee" class="marquee" role="button" tabindex="0" aria-haspopup="dialog">
            <div class="marquee__viewport"><div class="marquee__track" id="marquee-track"></div></div>
          </section>
          <section id="market" class="market" role="button" tabindex="0" aria-haspopup="dialog"></section>
          <div class="tagbar-wrap" id="tagbar-wrap" data-at-start="1" data-at-end="1">
            <button type="button" class="tagbar-nav tagbar-nav--prev" id="tagbar-prev" aria-label="Anterior" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            </button>
            <div class="tagbar-viewport">
              <nav id="tagbar" class="tagbar" role="tablist" aria-label="Filtros"></nav>
            </div>
            <button type="button" class="tagbar-nav tagbar-nav--next" id="tagbar-next" aria-label="Próximo" disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
            </button>
          </div>
          <div id="feed-list" class="feed-list"></div>
          <section id="history" class="history hidden"></section>
        </div>

        <div id="view-lessons" class="hidden">
          <div class="lessons-layout">
            <div id="lessons-list" class="lessons-index"></div>
            <!-- Desktop only: lesson detail as a right panel that pushes the index left.
                 Tablet/mobile keep the shared modal below. -->
            <aside id="lesson-panel" class="lesson-panel" aria-hidden="true">
              <button class="lesson-panel__close" id="lesson-panel-close" aria-label="Fechar">✕</button>
              <div class="lesson-panel__actions">
                <button class="modal__action modal__complete" id="lesson-panel-complete">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
                </button>
                <button class="modal__action modal__share" id="lesson-panel-share" aria-label="Compartilhar">
                  <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
                </button>
              </div>
              <div class="lesson-panel__scroll" id="lesson-panel-content"></div>
            </aside>
          </div>
        </div>

        <!-- Glossary (app GlossarySlide parity) -->
        <div id="view-glossary" class="hidden">
          <div class="glossary">
            <div class="glossary__body">
              <div class="glossary__scroll" id="glossary-scroll">
                <div class="glossary__title-block">
                  <h1 class="glossary__title" id="glossary-title">Glossário</h1>
                  <div class="glossary__search" role="search">
                    <svg class="glossary__search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
                    <input type="search" id="glossary-search" class="glossary__search-input" autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" />
                    <button type="button" class="glossary__search-clear hidden" id="glossary-search-clear" aria-label="Limpar">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15 9l-6 6M9 9l6 6"/></svg>
                    </button>
                  </div>
                </div>
                <div id="glossary-list" class="glossary__list"></div>
              </div>
              <nav class="glossary__alpha" id="glossary-alpha" aria-label="A–Z" hidden></nav>
            </div>
          </div>
        </div>

        <!-- DCA Simulator (full-page view, same chrome as Glossary) -->
        <div id="view-dca" class="hidden">
          <div class="calc-page">
            <div class="calc-page__scroll" id="calc-dca-body"></div>
          </div>
        </div>

        <!-- Position Calculator (full-page view) -->
        <div id="view-pos" class="hidden">
          <div class="calc-page">
            <div class="calc-page__scroll" id="calc-pos-body"></div>
          </div>
        </div>
      </div>
        </div><!-- /.app-shell -->
      </div><!-- /.app-body -->
    </main>

    <!-- Glossary term tooltip — hover (desktop) / focus (keyboard) -->
    <div id="glossary-tooltip-root" class="g-tooltip-root" hidden>
      <div class="g-tooltip" id="glossary-tooltip" role="tooltip">
        <div class="g-tooltip__arrow" id="glossary-tooltip-arrow" aria-hidden="true"></div>
        <div class="g-tooltip__body">
          <div class="g-tooltip__term" id="glossary-tooltip-term"></div>
          <p class="g-tooltip__def" id="glossary-tooltip-def"></p>
        </div>
      </div>
    </div>

    <!-- Post detail modal (also used for lessons on tablet/mobile) -->
    <div id="modal" class="modal hidden" role="dialog" aria-modal="true">
      <div class="modal__backdrop" id="modal-backdrop"></div>
      <div class="modal__panel">
        <button class="modal__close" id="modal-close" aria-label="Fechar">✕</button>
        <div class="modal__actions">
          <!-- Lessons only: mark completed. Sits beside share, not instead of it. -->
          <button class="modal__action modal__complete hidden" id="modal-complete">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
          </button>
          <button class="modal__action modal__share" id="modal-share" aria-label="Compartilhar">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
          </button>
        </div>
        <div class="modal__scroll" id="modal-content"></div>
        <!-- Post alt-language offer — fixed footer inside the panel (same chrome as close/share). -->
        <div id="post-lang-banner" class="modal__lang-footer hidden">
          <span id="post-lang-banner-text" class="modal__lang-footer-text"></span>
          <button type="button" id="post-lang-banner-switch" class="modal__lang-footer-btn"></button>
          <button type="button" id="post-lang-banner-close" class="modal__lang-footer-close" aria-label="Fechar">✕</button>
        </div>
      </div>
    </div>

    <!-- Indicator info modal (Fear & Greed + MVRV) — compact sheet, mirrors app indicator-info -->
    <div id="indicator-modal" class="imodal hidden" role="dialog" aria-modal="true" aria-labelledby="indicator-modal-title">
      <div class="imodal__backdrop" id="indicator-modal-backdrop"></div>
      <div class="imodal__panel">
        <div class="imodal__header">
          <h2 id="indicator-modal-title" class="imodal__title"></h2>
          <button type="button" class="imodal__close" id="indicator-modal-close" aria-label="Fechar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="imodal__scroll" id="indicator-modal-content"></div>
      </div>
    </div>

    <!-- Crypto market modal (marquee → chart) — mirrors app/crypto-market.tsx -->
    <div id="market-modal" class="mm hidden" role="dialog" aria-modal="true" aria-label="Market">
      <div class="mm__backdrop" id="market-modal-backdrop"></div>
      <div class="mm__panel">
        <div class="mm__header">
          <div class="mm__coin-header" id="mm-header"></div>
          <button type="button" class="mm__close" id="market-modal-close" aria-label="Fechar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="mm__chart-wrap" id="mm-chart-wrap">
          <div class="mm__chart" id="mm-chart"></div>
          <div class="mm__tooltip hidden" id="mm-tooltip"></div>
        </div>
        <div class="mm__periods" id="mm-periods" role="tablist"></div>
        <div class="mm__divider"></div>
        <div class="mm__grid" id="mm-grid"></div>
      </div>
    </div>

    <!-- Fullscreen image viewer -->
    <div id="lightbox" class="lightbox hidden">
      <button id="lightbox-close" class="lightbox__close" aria-label="Fechar">✕</button>
      <img id="lightbox-img" src="" alt="" />
    </div>

    <!-- Calc overlay: sheet (phone) / popover (tablet+ coin picker) / modal (fee config) -->
    <div id="calc-sheet" class="csheet csheet--sheet hidden" role="dialog" aria-modal="true" aria-labelledby="calc-sheet-title">
      <div class="csheet__backdrop" id="calc-sheet-backdrop"></div>
      <div class="csheet__panel">
        <div class="csheet__handle" aria-hidden="true"></div>
        <div class="csheet__header">
          <h2 id="calc-sheet-title" class="csheet__title"></h2>
          <button type="button" class="csheet__close" id="calc-sheet-close" aria-label="Fechar">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
          </button>
        </div>
        <div class="csheet__body" id="calc-sheet-body"></div>
      </div>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="./i18n.js?v=43" defer></script>
    <script src="./app.js?v=92" defer></script>
  </body>
</html>
